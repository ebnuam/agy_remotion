<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <g filter="url(#carGlow)">
    <!-- Shadow beneath car -->
    <ellipse cx="300" cy="380" rx="260" ry="35" fill="rgba(0,0,0,0.65)"/>

    <!-- Car Body Lower -->
    <path d="M 70 330 L 510 330 L 540 260 L 500 230 L 110 230 L 60 270 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="5"/>
    
    <!-- Cabin Roof & Pillars -->
    <path d="M 140 230 L 190 140 L 410 140 L 460 230 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="5"/>
    
    <!-- Tinted Windows -->
    <polygon points="195,150 280,150 280,220 155,220" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    <polygon points="295,150 395,150 440,220 295,220" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    
    <!-- Glowing Headlights -->
    <ellipse cx="80" cy="285" rx="16" ry="12" fill="#FEF08A"/>
    <ellipse cx="510" cy="285" rx="16" ry="12" fill="#FEF08A"/>

    <!-- Wheels -->
    <circle cx="170" cy="345" r="48" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="170" cy="345" r="20" fill="#94A3B8"/>
    <circle cx="430" cy="345" r="48" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="430" cy="345" r="20" fill="#94A3B8"/>
  </g>
</svg>